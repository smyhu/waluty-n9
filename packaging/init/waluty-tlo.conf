# Waluty: background refresh of exchange rates and the Feed entry.
# Jobs in /etc/init/apps are started with the user session.
# Runs as root; tlo.py restarts itself as the user through devel-su (on the N9
# aegis-exec -u user gives 'nobody' and Aegis blocks setuid() even for root).
description "Waluty background refresh"
author "Claude with smyhu"

stop on core_shutdown
console none

respawn
respawn limit 3 300
normal exit 0

exec /opt/waluty/tlo.py
